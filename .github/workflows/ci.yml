name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run verify:xdc
      - uses: actions/upload-artifact@v4
        with:
          name: split-stack-xdc
          path: dist-xdc/split-stack.xdc
          if-no-files-found: error

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- --workers=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: split-stack-playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results
          retention-days: 3
          if-no-files-found: ignore
